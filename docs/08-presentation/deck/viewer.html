<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cobble AWS Platform</title>
    <!-- Plays index.html as a slideshow in any browser, without the HyperFrames player. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0f17; overflow: hidden; font-family: system-ui, sans-serif; }
      #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }
      #deck { width: 1920px; height: 1080px; border: 0; display: block; background: #ffffff; }
      #hit { position: fixed; inset: 0; cursor: pointer; }
      #bar { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 4px; align-items: center; background: rgba(20, 33, 61, 0.88); color: #ffffff; border-radius: 999px; padding: 4px 8px; font-size: 14px; }
      #bar button { background: none; border: 0; color: #ffffff; font-size: 18px; cursor: pointer; padding: 6px 10px; }
      #count { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="deck" src="index.html" title="Cobble AWS Platform slides"></iframe></div>
    <div id="hit" aria-hidden="true"></div>
    <div id="bar">
      <button id="prev" aria-label="Previous slide">‹</button>
      <span id="count">Loading…</span>
      <button id="next" aria-label="Next slide">›</button>
      <button id="full" aria-label="Full screen">⛶</button>
    </div>
    <script>
      const frame = document.getElementById("deck");
      const stage = document.getElementById("stage");
      const count = document.getElementById("count");
      let stops = [], at = 0, total = 0, stackWin = null;

      function fit() {
        const k = Math.min(innerWidth / 1920, innerHeight / 1080);
        stage.style.transform = `translate(${-960 * k}px, ${-540 * k}px) scale(${k})`;
      }

      // The 3D network slide is a sub-composition the HyperFrames runtime would normally load.
      async function mountStack(doc) {
        const host = doc.querySelector("[data-composition-src]");
        if (!host) return;
        const html = await (await fetch(host.dataset.compositionSrc)).text();
        const vars = host.dataset.variableValues || "{}";
        const inner = document.createElement("iframe");
        inner.style.cssText = "width:1920px;height:1080px;border:0;display:block";
        inner.srcdoc = html.replace("<head>", `<head><script>window.__hfVariables = ${vars};<\/script>`);
        host.appendChild(inner);
        await new Promise((r) => inner.addEventListener("load", r, { once: true }));
        stackWin = inner.contentWindow;
        await stackWin.__hf?.buildReady?.["exploded-stack"];
      }

      function show() {
        const s = stops[at];
        for (const stop of stops) stop.el.style.visibility = stop.el === s.el ? "visible" : "hidden";
        frame.contentWindow.__timelines[s.id]?.seek(s.t, false);
        if (s.el.querySelector("[data-composition-src]")) stackWin?.__timelines?.["exploded-stack"]?.seek(s.t, false);
        count.textContent = `${s.n + 1} / ${total}`;
        history.replaceState(null, "", "#" + (s.n + 1));
      }

      function go(d) {
        at = Math.max(0, Math.min(stops.length - 1, at + d));
        show();
        fetch("go", { method: "POST", body: String(at) }).catch(() => {}); // tell everyone else
      }

      // Shared position from serve.js: when anyone moves, every viewer follows.
      let shared = null;
      const follow = (n) => {
        shared = n;
        if (!stops.length || n === at) return;
        at = Math.max(0, Math.min(stops.length - 1, n));
        show();
      };
      try {
        const events = new EventSource("events");
        events.onmessage = (e) => follow(Number(e.data));
        events.onerror = () => events.readyState === EventSource.CLOSED && events.close();
      } catch {}

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        const island = JSON.parse(doc.querySelector('script[type="application/hyperframes-slideshow+json"]').textContent);
        const scenes = new Map([...doc.querySelectorAll(".scene")].map((s) => [s.dataset.compositionId, s]));
        island.slides.forEach((slide, n) => {
          const el = scenes.get(slide.sceneId);
          const start = +el.dataset.start, dur = +el.dataset.duration;
          // Hold points: the slide's fragments (deck time → slide time), else its midpoint.
          const holds = slide.fragments?.length ? slide.fragments.map((f) => f - start) : [dur / 2];
          holds.forEach((t) => stops.push({ n, id: slide.sceneId, el, t }));
        });
        total = island.slides.length;
        await mountStack(doc);
        const first = stops.findIndex((s) => s.n === +location.hash.slice(1) - 1);
        at = shared ?? (first < 0 ? 0 : first);
        show();
        doc.addEventListener("keydown", onKey);
      });

      function onKey(e) {
        if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
        if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
        if (e.key === "f") document.documentElement.requestFullscreen?.();
      }
      addEventListener("keydown", onKey);
      addEventListener("resize", fit);
      document.getElementById("hit").addEventListener("click", (e) => go(e.clientX > innerWidth / 3 ? 1 : -1));
      document.getElementById("prev").addEventListener("click", () => go(-1));
      document.getElementById("next").addEventListener("click", () => go(1));
      document.getElementById("full").addEventListener("click", () => document.documentElement.requestFullscreen?.());
      fit();
    </script>
  </body>
</html>
