name: Task
description: A piece of work for a deliverable or the platform
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing, and why.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it is finished. Checkable where possible.
      placeholder: |
        - [ ] Deployed, torn down and redeployed; final plan exits 0
        - [ ] Run recorded in the evidence log
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [landing zone, workload, modules, CI, runbooks, docs / deliverables, project management]
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent issue
      placeholder: "#9"
