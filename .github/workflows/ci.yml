name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - '*-dev'

jobs:
  terraform-validate:
    name: Terraform format & validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # bootstrap/ is a separate root module (its own local state, not
        # sourced by infrastructure/main.tf), so it needs its own init+validate.
        working-directory: [infrastructure, infrastructure/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  terraform-test:
    name: Terraform module tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each module's tests/*.tftest.hcl uses mock_provider (or an
        # offline-configured real provider), so these run without any
        # AWS credentials and never touch the real account.
        working-directory:
          - infrastructure/network
          - infrastructure/data
          - infrastructure/foundation/budget
          - infrastructure/foundation/logging
          - infrastructure/foundation/oidc-deploy-role
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform test
        run: terraform test

  security-scan:
    name: tfsec security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure
