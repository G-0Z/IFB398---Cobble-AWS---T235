name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - '*-dev'

# CI only reads the repo. Nothing here needs to write to GitHub.
permissions:
  contents: read

# Actions are pinned to a commit hash, not a tag: a tag can be moved to point
# at different code. The comment says which release the hash is.

jobs:
  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2 # same version the lock files were made with; bump deliberately

      - name: Terraform fmt check (all of infrastructure/)
        run: terraform fmt -check -recursive
        working-directory: infrastructure

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      # Run every job even if one fails, so each result is real.
      fail-fast: false
      matrix:
        # Every root config: Solution B, the state bucket (bootstrap),
        # Solution A's workload and each landing-zone step.
        working-directory:
          - infrastructure/solution-b
          - infrastructure/bootstrap
          - infrastructure/solution-a/workload
          - infrastructure/solution-a/landing-zone/identity
          - infrastructure/solution-a/landing-zone/1-organization
          - infrastructure/solution-a/landing-zone/2-security
          - infrastructure/solution-a/landing-zone/3-shared-services
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2 # same version the lock files were made with; bump deliberately

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  terraform-test:
    name: Terraform module tests
    runs-on: ubuntu-latest
    strategy:
      # Run every job even if one fails, so each result is real.
      fail-fast: false
      matrix:
        # Every module, plus Solution A's workload (its own end-to-end test).
        # Each tests/*.tftest.hcl uses mock_provider
        # (or an offline-configured real provider), so these run without any
        # AWS credentials and never touch the real account.
        working-directory:
          - infrastructure/modules/access-log-bucket
          - infrastructure/modules/account-baseline
          - infrastructure/modules/container-service
          - infrastructure/modules/github-oidc
          - infrastructure/modules/log-delivery
          - infrastructure/modules/network
          - infrastructure/modules/postgres-database
          - infrastructure/modules/s3-bucket
          - infrastructure/modules/security-baseline
          - infrastructure/solution-a/workload
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2 # same version the lock files were made with; bump deliberately

      # No backend: the tests use a mocked provider and never touch real
      # state. (solution-a/workload has an S3 backend that needs its key and
      # AWS credentials, which CI doesn't have.)
      - name: Terraform init
        run: terraform init -input=false -backend=false

      - name: Terraform test
        run: terraform test

  security-scan:
    name: Trivy security scan
    runs-on: ubuntu-latest
    strategy:
      # Run every job even if one fails, so each result is real.
      fail-fast: false
      matrix:
        # Every root config. Trivy follows each root's module calls into
        # modules/, so every module gets scanned through them.
        working-directory:
          - infrastructure/solution-b
          - infrastructure/bootstrap
          - infrastructure/solution-a/workload
          - infrastructure/solution-a/landing-zone/identity
          - infrastructure/solution-a/landing-zone/1-organization
          - infrastructure/solution-a/landing-zone/2-security
          - infrastructure/solution-a/landing-zone/3-shared-services
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fails on any finding, of any severity. Deliberate exceptions are
      # inline #trivy:ignore (or older #tfsec:ignore) comments with a reason,
      # plus .trivyignore.yaml for any Trivy can't take inline (none today).
      - name: Run Trivy (Terraform misconfiguration scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.working-directory }}
          trivyignores: .trivyignore.yaml
          exit-code: '1'
          version: v0.74.0

  module-docs:
    name: Module READMEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same version as infrastructure/modules/.terraform-docs.yml asks for;
      # the checksum is the one published with the release.
      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  terraform-docs.tar.gz" | sha256sum -c
          tar -xzf terraform-docs.tar.gz terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      # Fails if any module's generated Reference section is out of date.
      # Fix: run `terraform-docs -c ../.terraform-docs.yml .` in that module.
      - name: Check every module README is up to date
        run: |
          status=0
          for dir in infrastructure/modules/*/; do
            if ! (cd "$dir" && terraform-docs -c ../.terraform-docs.yml --output-check . > /dev/null); then
              echo "::error file=${dir}README.md::Reference section is out of date. Run terraform-docs -c ../.terraform-docs.yml . in ${dir}"
              status=1
            fi
          done
          exit $status

  # One check that sums up all the others, so the main ruleset can require a
  # single, stable check name instead of every matrix job.
  ci-passed:
    name: CI passed
    if: always()
    needs: [terraform-fmt, terraform-validate, terraform-test, security-scan, module-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any check failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
